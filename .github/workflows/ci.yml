name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, release/*]
  push:
    branches: [main]
  schedule:
    # Nightly heavy-suite run (non-blocking, measured)
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Manual trigger for on-demand heavy suite runs

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Per-PR correctness gate (hard-blocking) ─────────────────────
  correctness-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - run: npx tsc --noEmit

      - run: npm run build
        env:
          SENTRY_AUTH_TOKEN: ''

      - name: Provision test database
        if: env.TEST_DATABASE_URL
        run: npx tsx db/migrate.ts
        env:
          MIGRATION_RESET: 'true'

      # Correctness suites (1-2) only — hard gate
      - run: npm run test:correctness
        env:
          CI: 'true'

  # ── Nightly heavy suite (non-blocking, measured) ────────────────
  heavy-suite:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci --legacy-peer-deps

      - name: Provision test database
        if: env.TEST_DATABASE_URL
        run: npx tsx db/migrate.ts
        env:
          MIGRATION_RESET: 'true'

      # All heavy suites (1-6) — non-blocking, results recorded
      - run: npm run test:heavy
        env:
          CI: 'true'

      - name: Record results
        if: always()
        run: |
          echo "## Heavy Suite Results" >> $GITHUB_STEP_SUMMARY
          echo "Run completed at $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "See test output above for pass/fail details." >> $GITHUB_STEP_SUMMARY
